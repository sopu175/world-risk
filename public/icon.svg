<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e"/>
      <stop offset="50%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="beaconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <!-- Base Circle Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Globe Ring -->
  <circle cx="256" cy="256" r="180" stroke="#5eead4" stroke-opacity="0.3" stroke-width="4" stroke-dasharray="8 6"/>

  <!-- Latitude / Longitude Ellipses -->
  <ellipse cx="256" cy="256" rx="180" ry="80" stroke="#5eead4" stroke-opacity="0.25" stroke-width="3"/>
  <ellipse cx="256" cy="256" rx="90" ry="180" stroke="#5eead4" stroke-opacity="0.25" stroke-width="3"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#5eead4" stroke-opacity="0.35" stroke-width="3"/>
  <line x1="256" y1="76" x2="256" y2="436" stroke="#5eead4" stroke-opacity="0.35" stroke-width="3"/>

  <!-- Ocean Swell & Dynamic Wave Crest -->
  <path d="M120 280 C 160 230, 200 320, 256 260 C 310 200, 350 290, 392 240" stroke="url(#pulseGrad)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M140 330 C 180 290, 215 360, 265 310 C 315 260, 345 330, 372 300" stroke="#2dd4bf" stroke-width="10" stroke-linecap="round" stroke-opacity="0.7" fill="none"/>

  <!-- Central Seismic Beacon / Hazard Node -->
  <circle cx="256" cy="210" r="28" fill="url(#beaconGrad)"/>
  <circle cx="256" cy="210" r="14" fill="#ffffff"/>

  <!-- Pulse Rings radiating from beacon -->
  <circle cx="256" cy="210" r="48" stroke="#f59e0b" stroke-opacity="0.7" stroke-width="4" stroke-dasharray="6 6"/>
</svg>
